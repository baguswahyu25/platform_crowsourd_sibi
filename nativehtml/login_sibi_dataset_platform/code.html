<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-primary-inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        .card-elevation {
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.05), 0px 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center px-gutter">
<!-- Login Container -->
<main class="w-full max-w-[448px] py-xl">
<!-- Logo Section -->
<div class="flex justify-center mb-xl">
<img alt="Logo SIBI Dataset Platform" class="h-24 w-24 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTaRbllirCF_3dQFKFQOxTi_oiifUNb1IwXca-rQ5TKqpdNd0sq32oaXXLno9tFYlB1kn-OlKpSvg069d8hE1FS84035jdkEJU9m6m6T6qsdOmlSHLFtkqFLFeofWtKv5i1r94MqBEgFKp9BYpb4pGRxt44N_Mm_0hmmiXatIHmKqDZsXrOi5rTqqdure4a39jXJJkAIna7m59yiDk0cwsTt9ZlkRCGqvnwrBDeApZSR9A3Y4wmjLsnw"/>
</div>
<!-- Card Container -->
<div class="bg-surface-container-lowest rounded-[20px] p-xl border border-outline-variant/30 card-elevation transition-all duration-300">
<!-- Header Text -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-base">Masuk ke Sistem</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk menggunakan akun Anda.</p>
</div>
<!-- Form -->
<form class="space-y-lg" id="loginForm" onsubmit="return handleLogin(event)">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Alamat Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px] text-outline">mail</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pl-[44px] pr-md font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none placeholder:text-outline-variant" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
<p class="hidden text-error font-label-sm text-label-sm mt-1" id="emailError">Harap masukkan format email yang valid.</p>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Kata Sandi</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px] text-outline">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3 pl-[44px] pr-[44px] font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" id="remember" type="checkbox"/>
<label class="ml-base font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Ingat Saya</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary text-white font-label-md text-label-md py-3 rounded-xl btn-primary-inner-glow transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-base" id="submitBtn" type="submit">
<span id="btnText">Masuk</span>
<span class="hidden animate-spin h-5 w-5 border-2 border-white/30 border-t-white rounded-full" id="spinner"></span>
</button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-label-sm font-label-sm">
<span class="px-md bg-surface-container-lowest text-outline italic">atau</span>
</div>
</div>

<a class="w-full flex items-center justify-center gap-base border border-outline-variant text-on-surface font-label-md text-label-md py-3 rounded-xl hover:bg-surface-container-low transition-all active:scale-[0.98]" href="#">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                Kembali ke Beranda
            </a>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Belum memiliki akun? 
                    <a class="text-primary font-semibold hover:underline" href="#">Daftar Sekarang</a>
</p>
</div>
</div>
<!-- Privacy Footer -->
<p class="mt-xl text-center font-label-sm text-label-sm text-outline">
            © 2024 SIBI Dataset Platform. Hak Cipta Dilindungi.
        </p>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');

            // Basic Validation View
            if (!emailInput.value.includes('@')) {
                emailError.classList.remove('hidden');
                emailInput.classList.add('border-error', 'ring-error/20');
                return false;
            } else {
                emailError.classList.add('hidden');
                emailInput.classList.remove('border-error', 'ring-error/20');
            }

            // Simulate Loading State
            btn.disabled = true;
            btnText.classList.add('opacity-0');
            spinner.classList.remove('hidden');
            
            setTimeout(() => {
                // Simulate error feedback
                btn.classList.add('bg-error', 'hover:bg-error');
                btnText.innerText = 'Email atau Password Salah';
                btnText.classList.remove('opacity-0');
                spinner.classList.add('hidden');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('bg-error', 'hover:bg-error');
                    btnText.innerText = 'Masuk';
                }, 2000);
            }, 1500);

            return false;
        }

        // Focus ring visual hint
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
